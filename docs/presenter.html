<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>불꽃배웅 — 발표자 보기</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 발표자 보기 — deck.html 에서 p 키로 연다. 본창과 BroadcastChannel("deck") 로 동기화:
   본창 → {index,total,labels,notes} · 이 창 → {goTo}. 미리보기 두 장은 deck.html 을 role=cur|next 로 띄운 iframe(레일 없음). */
:root{--bg:#0F1115;--card:#171A21;--ink:#F2F4F6;--sub:#8B95A1;--accent:#F36F21;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr;gap:14px;padding:16px;overflow:hidden}
header{display:flex;align-items:center;gap:22px;font-size:15px;color:var(--sub)}
header .t{font:600 34px/1 var(--mono);color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
header .idx{font:600 18px/1 var(--mono);color:var(--ink)}
header .keys{margin-left:auto;font-size:13px}
header kbd{display:inline-block;padding:2px 7px;border-radius:6px;background:#262B36;color:var(--ink);font:600 12px var(--mono);margin:0 2px}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:14px;min-height:0}
.frame{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;width:100%}
.frame iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.frame .lab{position:absolute;left:12px;top:10px;padding:4px 10px;border-radius:8px;background:rgba(15,17,21,.75);color:var(--ink);font:600 13px var(--mono)}
#cur{grid-column:1;grid-row:1}
#next{grid-column:2;grid-row:1}
#notes{grid-column:1 / -1;grid-row:2;background:var(--card);border-radius:14px;padding:26px 30px;font-size:30px;line-height:1.55;overflow:auto;min-height:0;text-wrap:pretty}
#notes .lbl{font-size:14px;color:var(--sub);margin-bottom:10px;font-weight:600}
#notes .nx{margin-top:22px;padding-top:16px;border-top:1px solid #262B36;font-size:18px;color:var(--sub);line-height:1.5}
#notes .nx b{color:var(--ink);font-weight:600}
#notes .demo{margin-top:22px;padding:18px 22px;border-radius:12px;background:#22160E;border:1px solid #4A2A10;font-size:22px;line-height:1.55;color:#FFD9BF;white-space:pre-line}
#notes .demo .lbl{color:var(--accent)}
@media (max-width:1100px){main{grid-template-columns:1fr}#next{grid-column:1;grid-row:2}#notes{grid-row:3}}
</style>
</head>
<body>
<header>
  <span class="t" id="clock">00:00</span>
  <span class="idx" id="idx">— / —</span>
  <span id="label"></span>
  <span class="keys"><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>t</kbd> 시계 리셋 · <kbd>Home</kbd> 처음</span>
</header>
<main>
  <div class="frame" id="cur"><iframe src="deck.html?_snthumb=1&role=cur#1" title="현재 슬라이드"></iframe><span class="lab">지금</span></div>
  <div class="frame" id="next"><iframe src="deck.html?_snthumb=1&role=next#2" title="다음 슬라이드"></iframe><span class="lab">다음</span></div>
  <div id="notes"><div class="lbl">발표자 노트</div><div id="ntext">본창(deck.html)에서 슬라이드를 넘기면 여기가 따라옵니다.</div><div class="demo" id="ndemo" hidden><div class="lbl">시연 대본</div><div id="ndemotext"></div></div><div class="nx" id="nnext"></div></div>
</main>
<script>
(function () {
  var ch = new BroadcastChannel("deck");
  var state = { index: 0, total: 0, labels: [], notes: [] };
  function fit() {
    document.querySelectorAll(".frame").forEach(function (f) {
      var s = f.clientWidth / 1920; var ifr = f.querySelector("iframe");
      ifr.style.transform = "scale(" + s + ")";
    });
  }
  function render() {
    var i = state.index, n = state.total;
    document.getElementById("idx").textContent = (i + 1) + " / " + n;
    document.getElementById("label").textContent = state.labels[i] || "";
    document.getElementById("ntext").textContent = state.notes[i] || "";
    var dm = (state.demos || [])[i] || "";
    document.getElementById("ndemo").hidden = !dm;
    document.getElementById("ndemotext").textContent = dm;
    var nx = document.getElementById("nnext");
    nx.innerHTML = i + 1 < n ? "<b>다음 · " + esc(state.labels[i + 1] || "") + "</b> — " + esc(state.notes[i + 1] || "") : "<b>마지막 장</b>";
  }
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  ch.onmessage = function (e) {
    var d = e.data || {};
    if (typeof d.index === "number") { state = d; render(); }
  };
  ch.postMessage({ hello: true });            // 본창이 현재 상태를 다시 보내준다
  var T0 = Date.now();
  setInterval(function () {
    var t = Math.floor((Date.now() - T0) / 1000);
    document.getElementById("clock").textContent = ("0" + Math.floor(t / 60)).slice(-2) + ":" + ("0" + (t % 60)).slice(-2);
  }, 500);
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " ") { ch.postMessage({ goTo: state.index + 1 }); e.preventDefault(); }
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp") { ch.postMessage({ goTo: state.index - 1 }); e.preventDefault(); }
    else if (k === "Home") ch.postMessage({ goTo: 0 });
    else if (k === "End") ch.postMessage({ goTo: state.total - 1 });
    else if (k === "t") T0 = Date.now();
  });
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
