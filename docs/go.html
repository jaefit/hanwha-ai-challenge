<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지금 어디로 나갈까 — 서울세계불꽃축제 2026</title>
<meta name="description" content="여의도 불꽃축제 귀가 안내. 열면 바로 — 지금 가장 빨리 나갈 수 있는 역과 걸어갈 길.">
<meta name="theme-color" content="#F5F4F1">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* ── 토큰 — Claude Design 「귀가 내비 v2」(2026-09-04) 그대로. 라이트 단일. ── */
:root{
  --bg:#F5F4F1; --sheet:#FFFFFF; --ink:#14110C; --ink-2:#5B554B; --sub:#8F897D; --rule:#E2DFD8;
  --live:#2A78D6; --offline:#D0342C;
  --g-여유:#2E7D5B; --g-주의:#8A6400; --g-경계:#B0521C; --g-심각:#B3352B; --g-통제:#8F897D; --g-없음:#8F897D;
  --sheet-h:280px; --sheet-top:104px;
  --shadow-sheet:0 -2px 6px rgba(20,17,12,.06),0 -18px 48px rgba(20,17,12,.12);
  --ease-sheet:320ms cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
#stage{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:#E9E6DF}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-attrib{display:none!important}
#hatch{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,rgba(20,17,12,.03) 0 6px,transparent 6px 14px)}

/* 상단 — 신선도 필 하나 */
.top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:flex-end;
  pointer-events:none;transition:opacity .25s}
.pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);
  box-shadow:0 1px 2px rgba(20,17,12,.08),0 6px 18px rgba(20,17,12,.08);font-size:13px;font-weight:700;color:var(--ink-2)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--sub);display:block}
.pill.live i{background:var(--live)} .pill.off i{background:var(--offline)}
.pill em{font-style:normal;font-weight:500;color:var(--sub)}

/* 지도 위, 시트 바로 위 — 위치 안내 · 범례 */
/* 시트와 같은 폭(최대 520)으로 맞춘다 — 넓은 화면에서 안내·범례만 끝까지 늘어나지 않게 */
.over{position:absolute;left:0;right:0;max-width:520px;margin:0 auto;padding:0 12px;bottom:calc(var(--sheet-h) + 12px);
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;transition:opacity .25s,bottom var(--ease-sheet)}
.note{align-self:stretch;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:14px;background:rgba(20,17,12,.88);color:#F5F4F1;
  font-size:15px;line-height:1.35;box-shadow:0 8px 24px rgba(20,17,12,.18)}
.note span{flex:1} .note b{font-weight:800}
.note button{flex:none;height:36px;padding:0 12px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#F5F4F1;font-size:14px;font-weight:700}
.legend{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.86);font-size:12px;font-weight:700;color:var(--ink-2);pointer-events:none}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.legend em{font-style:normal;font-weight:500;color:var(--sub)}
html.open .top,html.open .over{opacity:0}

/* 바텀시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;height:var(--sheet-h);background:var(--sheet);border-radius:24px 24px 0 0;
  box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;transition:height var(--ease-sheet)}
html.open{--sheet-h:calc(100% - var(--sheet-top))}
.handle{flex:none;height:28px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.handle i{width:44px;height:5px;border-radius:3px;background:var(--rule);display:block}
.body{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 20px calc(24px + env(safe-area-inset-bottom))}

/* 히어로 */
.eyebrow{padding:16px 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.eyebrow b{font-size:16px;font-weight:700;color:var(--ink-2)}
.eyebrow span{font-size:14px;font-weight:700;color:var(--sub)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .l{min-width:0}
.hname{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmin{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.hmin .w{font-size:18px;font-weight:700;color:var(--ink-2)}
.hmin .n{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.04em;color:var(--gc)}
.hmin .u{font-size:22px;font-weight:800;color:var(--gc)}
.hmin .km{font-size:14px;font-weight:600;color:var(--sub);margin-left:6px}
.hero .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-bottom:10px}
.gchip{height:34px;padding:0 14px;border-radius:999px;background:var(--gc);color:#fff;font-size:16px;font-weight:800;display:inline-flex;align-items:center}
.hwait{font-size:13px;font-weight:700;color:var(--sub);min-height:18px}
.hreason{margin-top:6px;font-size:16px;line-height:1.45;color:var(--ink-2)}

/* 목적지 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:52px;padding:0 16px 0 14px;border-radius:16px;border:0;background:var(--bg);color:var(--ink);
  display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;white-space:nowrap}
.chip b{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.chip small{font-size:13px;font-weight:600;line-height:1.2;opacity:.7}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:0 6px 16px rgba(20,17,12,.22)}
.chip.dim{opacity:.55}

/* 펼침 — 근거 */
.more{margin-top:22px;display:flex;flex-direction:column;gap:22px}
.sec{font-size:14px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin-bottom:8px}
.sec.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec .hint{font-size:13px;font-weight:700;color:var(--sub)}
.rank{border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.rk{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--rule);cursor:pointer;background:var(--sheet)}
.rk:last-child{border-bottom:0}
.rk.on{background:var(--bg)}
.rk .no{font-size:13px;font-weight:800;color:var(--sub)}
.rk .nm{font-size:17px;font-weight:800;letter-spacing:-.01em;min-width:0}
.rk .nm small{font-size:15px;font-weight:700;color:var(--ink-2)}
.rk .why{font-size:14px;color:var(--ink-2);margin-top:2px}
.rk .g{font-size:14px;font-weight:800;color:var(--gc)}
.chart{position:relative;height:132px;max-width:350px;margin:0 auto;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:132px;overflow:hidden}
.tip{position:absolute;top:0;transform:translateX(-50%);padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
.ctrl{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:15px;line-height:1.45;color:var(--ink-2)}
.ctrl b{flex:none;color:var(--ink);font-weight:800}
.src{font-size:12px;line-height:1.6;color:var(--sub)}
.src a{color:var(--ink-2)}

/* 지도 마커 */
.lbl{font:700 11px Pretendard,system-ui,sans-serif;color:var(--ink);pointer-events:none;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:4px;white-space:nowrap}
.lbl.on{background:#1A1A1A;color:#fff}
.me{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(20,17,12,.3);display:flex;align-items:center;justify-content:center}
.me img{width:24px;height:auto;display:block;pointer-events:none}
.me.drag{cursor:grab}
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="hatch" hidden></div>

  <div class="top" id="top">
    <div class="pill" id="fresh"><i></i><span id="fword">불러오는 중</span><em id="ftime"></em></div>
  </div>

  <div class="over" id="over">
    <div class="note" id="geonote" hidden>

            <div class="tip" id="tip"></div>
          </div>

        <div class="ctrl"><b>통제</b><span>여의동로 15~24시 · 여의나루역 20:40~21:40 무정차 · 원효대교 차량</span></div>
        <div class="src">숫자는 예측이고 현장과 다를 수 있다. 안전 안내는 현장 요원과 공식 방송을 따를 것.<br>
          출처 — 서울시 실시간 도시데이터 · 서울교통공사 · KT 생활이동 · TOPIS CCTV · 지도 © OpenStreetMap contributors.
          <a href="index.html">근거·운영 화면 →</a></div>
      </div>
    </div>
  </section>
</div>

<script src="app/board.js"></script>
<script src="app/field.js"></script>
<script src="app/routing_extra.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* 관람객 화면 v2 — 묻지 않는다.
   출발지는 위치 권한으로(거절·여의도 밖이면 이벤트광장 + 핀 드래그), 목적지는 도보+대기 1위,
   시각은 지금(차트를 문질러 옮긴다). 판정 규칙은 app/board.js, 혼잡장·속도식은 app/field.js —
   운영 화면(index.html)과 같은 모듈이라 같은 데이터에 같은 답을 낸다.
   디자인: Claude Design 「귀가 내비 v2」 2026-09-04. */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EVENT=[126.9320,37.5292];               // 이벤트광장 — 위치 못 받으면 여기서 출발
const FAR_M=3000;                             // 여의도에서 이보다 멀면 "여기 없다"고 보고 이벤트광장 기준
const distM=(a,b)=>Field.distanceM(a,b);
let DATA=null,PRIOR=null,HOUR=null,SEL=null,OPEN=false,ORIGIN=EVENT.slice(),GEO="asking";
let MAP=null,MAPREADY=false,CAMS=null,FIELD=null,FGRID=null,FBOUNDS=null,NOBS=0,LABELS={},ME=null,FITKEY="",FITTED=false;
let GRAPH=null,GNODES=null,GLOADING=false,FIELD_VER=0;const RMEMO={key:"",by:{}};

/* 역별 근사 경유점 (디자인 그대로) — 보행망(5.9MB, 전송 0.8MB)을 받기 전까지의 폴백.
   길이는 직선합 ×1.15. 보행망이 오면 아래 routeGraph() 가 자리를 대신한다. */
const WAY={naru:[[126.9327,37.5271]],
  yd9:[[126.9318,37.5268],[126.9290,37.5238],[126.9262,37.5206]],
  yd5:[[126.9318,37.5268],[126.9270,37.5240],[126.9238,37.5222]],
  saet:[[126.9318,37.5268],[126.9300,37.5225],[126.9287,37.5172]],
  gukhoe:[[126.9300,37.5290],[126.9240,37.5292],[126.9174,37.5281]],
  singil:[[126.9318,37.5268],[126.9250,37.5230],[126.9190,37.5190],[126.9137,37.5170]],
  mapo:[[126.9299,37.5287],[126.9426,37.5375],[126.9459,37.5391]]};
const DETOUR=1.15;
// @pure path start
/** 원점에서 역까지의 경유점 열. 경유점은 광장 출발 기준이라, 핀을 옮기면 뒤에 남은 것은 버리고
    남은 길이가 가장 짧아지는 경유점부터 이어 붙인다 — 안 그러면 광장 옆으로 되돌아가는 길을 잰다. */
function path(key){
  const W=WAY[key]||[];if(!W.length)return[ORIGIN];
  let best=0,bl=Infinity;
  for(let j=0;j<W.length;j++){let L=distM(ORIGIN,W[j]);for(let k=j;k<W.length-1;k++)L+=distM(W[k],W[k+1]);if(L<bl){bl=L;best=j;}}
  return [ORIGIN].concat(W.slice(best));
}
// @pure path end

/* ── 보행망 A* — 운영 화면(index.html routeAstar)과 같은 그래프·같은 비용. 선이 길을 따라가고, 본 곳이 붐비면 돌아간다.
   보행망은 첫 화면 뒤에 받는다(축제 통신에서 첫 답을 늦추지 않기 위해). 받기 전·못 받으면 위 근사 경유점. ── */
/* 도착점 = 서울 열린데이터광장 subwayStationMaster(역사마스터) 좌표, 2026-09-04 조회. 노선별로 건물이 다르다 —
   여의도(5) 여의나루로 지하40 · 여의도(9) 의사당대로 지하101 은 29m 떨어진 두 점. 신길은 여의도에서 먼저 닿는 경부선(1호선) 건물. */
const DEST={gukhoe:[126.917874,37.528105],mapo:[126.945932,37.539574],yd9:[126.92403,37.52176],yd5:[126.924357,37.521747],
  saet:[126.928422,37.517274],singil:[126.917865,37.516862],naru:[126.932901,37.527098]};
const tagv=v=>String(v==null?"":v).toLowerCase();
const allowed=e=>!/(motorway|trunk|busway)/.test(tagv(e.h))&&!/(^|,)(no|private)(,|$)/.test(tagv(e.f))&&!/(^|,)(no|private)(,|$)/.test(tagv(e.a));
async function loadGraph(){
  if(GRAPH||GLOADING)return;GLOADING=true;if(DATA)render();
  try{
    const g=await(await fetch("data/routing/walk_graph.json")).json();
    const edges=(typeof RoutingExtra!=="undefined")?RoutingExtra.withExtraEdges(g.edges):g.edges;
    const adj=new Map(),usable=new Set();
    for(const e of edges){if(!allowed(e))continue;if(!adj.has(e.u))adj.set(e.u,[]);adj.get(e.u).push(e);usable.add(e.u);usable.add(e.v);}
    GNODES=g.nodes;GRAPH={nodes:g.nodes,adj,usable:[...usable]};
  }catch(e){GRAPH=null;}                                        // 못 받으면 근사로 계속 — 화면에 「근사」가 남는다
  GLOADING=false;
  if(DATA)render();
}
function nearest(g,p){let b=null,bd=Infinity;for(const id of g.usable){const c=g.nodes[id];if(!c)continue;const d=distM(p,c);if(d<bd){bd=d;b=id;}}return b;}
/** 간선 중점이 떨어지는 장 격자 칸. 장이 없거나 밖이면 -1. */
function edgeCell(e){
  if(!FIELD||!FGRID)return -1;
  const c=(e.g&&e.g.length)?e.g[Math.floor(e.g.length/2)]:null;
  const a=c||GNODES[e.u],b=c?null:GNODES[e.v];
  const x=c?c[0]:(a&&b?(a[0]+b[0])/2:null),y=c?c[1]:(a&&b?(a[1]+b[1])/2:null);
  if(x==null)return -1;
  const ix=Math.floor((x-FGRID.x0)/FGRID.dx),iy=Math.floor((y-FGRID.y0)/FGRID.dy);
  if(ix<0||iy<0||ix>=FGRID.cols||iy>=FGRID.rows)return -1;
  return iy*FGRID.cols+ix;
}
const edgeUnit=e=>{const k=edgeCell(e);return k<0?0:Math.max(0,Math.min(1,FIELD.mean[k]));};
const edgeSd=e=>{const k=edgeCell(e);return k<0?F_SD_MAX:FIELD.sd[k];};
/** 그 간선을 걷는 초 — 경로를 고르는 비용이자 화면에 보여주는 시간. 본 곳은 관측 밀도, 못 본 곳은 가로 기본. */
const edgeSeconds=(m,e)=>Field.blendSeconds(m,edgeUnit(e),edgeSd(e),F_SD_MAX);
function astar(g,s,t){
  const cost=e=>edgeSeconds(Math.max(0.1,Number(e.m)||0.1),e);
  const dist=new Map([[s,0]]),came=new Map(),q=[[0,s]],goal=g.nodes[t];
  while(q.length){q.sort((a,b)=>a[0]-b[0]);const[,u]=q.shift();if(u===t)break;
    for(const e of g.adj.get(u)||[]){const nd=dist.get(u)+cost(e);
      if(nd<(dist.has(e.v)?dist.get(e.v):Infinity)){dist.set(e.v,nd);came.set(e.v,[u,e]);
        q.push([nd+distM(g.nodes[e.v],goal)/Field.V_FREE,e.v]);}}}
  if(!came.has(t)&&s!==t)return null;
  const es=[];let u=t;while(u!==s){const v=came.get(u);if(!v)break;es.push(v[1]);u=v[0];}
  es.reverse();
  let meters=0;for(const e of es)meters+=Number(e.m)||0;
  return{edges:es,meters,seconds:dist.get(t)};
}
/** 보행망 경로. 원점·역과 가장 가까운 노드 사이는 짧은 연결선(가로 기본 속도)으로 잇는다. */
function routeGraph(key){
  const d=DEST[key];if(!GRAPH||!d)return null;
  const s=nearest(GRAPH,ORIGIN),t=nearest(GRAPH,d);if(s==null||t==null)return null;
  const out=astar(GRAPH,s,t);if(!out)return null;
  const g=GRAPH,coords=[ORIGIN];
  for(const e of out.edges){const u=g.nodes[e.u];let seg=(e.g||[u,g.nodes[e.v]]).slice();
    if(seg.length>1&&distM(seg[0],u)>distM(seg[seg.length-1],u))seg.reverse();
    for(const c of seg){const l=coords[coords.length-1];if(!l||l[0]!==c[0]||l[1]!==c[1])coords.push(c);}}
  coords.push(d);
  const c1=distM(ORIGIN,g.nodes[s]),c2=distM(g.nodes[t],d);
  const sec=out.seconds+Field.blendSeconds(c1,0,F_SD_MAX,F_SD_MAX)+Field.blendSeconds(c2,0,F_SD_MAX,F_SD_MAX);
  return{min:Math.max(1,Math.round(sec/60)),km:(out.meters+c1+c2)/1000,coords,approx:false};
}
/** 한 역까지의 경로 — 보행망이 있으면 A*, 없으면 근사. 원점·장·보행망이 같으면 다시 계산하지 않는다. */
function routeFor(key){
  const mk=ORIGIN.join(",")+"|"+FIELD_VER+"|"+(GRAPH?1:0);
  if(RMEMO.key!==mk){RMEMO.key=mk;RMEMO.by={};}
  if(RMEMO.by[key])return RMEMO.by[key];
  let out=null;
  if(GRAPH){try{out=routeGraph(key);}catch(e){out=null;}}
  if(!out)out=walkApprox(key);
  return RMEMO.by[key]=out;
}

// ── 데이터 ──
async function load(){
  let fresh=null;
  try{const r=await fetch("data/latest.json?"+Date.now(),{cache:"no-store"});
      if(r.ok){fresh=await r.json();try{localStorage.setItem("go-latest",JSON.stringify(fresh))}catch(e){}}}catch(e){}
  if(fresh)DATA=fresh;
  else if(!DATA){try{const c=localStorage.getItem("go-latest");if(c){DATA=JSON.parse(c);DATA.__offline=true;}}catch(e){}}
  else DATA.__offline=true;                  // 갱신 실패 — 들고 있던 것으로 계속
  if(!PRIOR){try{const r=await fetch("data/exit_forecast_2026.json",{cache:"no-store"});if(r.ok)PRIOR=await r.json();}catch(e){}}
  if(!CAMS){try{CAMS=await(await fetch("data/cams.json",{cache:"no-store"})).json();}catch(e){}}
  if(!DATA)DATA={};
  // 12시간 넘게 오래된 실시간은 사전 예측표로 물러난다 (index.html 과 같은 기준)
  const fc=DATA.forecast||{};
  if((!fc.exits||!Object.keys(fc.exits).length||Board.isStale(DATA.generated))&&PRIOR){
    DATA=Object.assign({},DATA,{forecast:Object.assign({},PRIOR,{prior:true})});
  }
  buildField();
  render();
  paintField();
}

// ── 혼잡장 — 운영 화면과 같은 경로 (CCTV 등급 → app/field.js → 격자 PNG). 상수도 같은 값. ──
const F_KERNEL={varShort:.125,lenShort:150,varLong:.125,lenLong:1200};
const F_SD_MAX=Math.sqrt(F_KERNEL.varShort+F_KERNEL.varLong);
const F_PAD=.012,F_COLS=140,F_ROWS=110,F_FEATHER=.18;
/* index.html apfPalette 와 같은 램프 — 등급 밴드 안에서는 색을 유지하고 경계에서만 넘어간다.
   칩·숫자의 등급색(--g-*)은 흰 글자 대비 때문에 어둡게 조정했지만, 지도 색은 운영 화면과 같아야 한다. */
const RAMP_HEX={V:"#2E7D5B",J:"#B8860B",G:"#C2622B",S:"#B3352B"};
const hex2rgb=h=>{h=h.replace("#","");return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
function fRamp(){const V=hex2rgb(RAMP_HEX.V),J=hex2rgb(RAMP_HEX.J),G=hex2rgb(RAMP_HEX.G),S=hex2rgb(RAMP_HEX.S);
  return [[0,V],[.50,V],[.63,J],[.78,G],[.92,S],[1,S]];}
function fHex(ramp,u){u=Math.max(0,Math.min(1,u));
  for(let i=0;i<ramp.length-1;i++){const[a,va]=ramp[i],[b,vb]=ramp[i+1];
    if(u>=a&&u<=b){const t=b>a?(u-a)/(b-a):0;return [0,1,2].map(k=>va[k]+(vb[k]-va[k])*t);}}
  return ramp[ramp.length-1][1];}

/** CCTV 레코드 → 관측. 신뢰도는 배제가 아니라 σ 로 표현한다 (index.html apfRows 와 같은 기준). */
function fieldObs(){
  const cctv=(DATA&&DATA.cctv)||{};
  const vals=Object.entries(cctv).map(([id,v])=>Object.assign({id:String(id)},v));
  const byId=new Map(vals.map(v=>[String(v.cam_id||v.id),v])),byName=new Map(vals.map(v=>[v.name,v]));
  const now=Date.now(),obs=[];
  (CAMS||[]).forEach(cam=>{
    const v=byId.get(String(cam.camId))||byName.get(cam.name)||null;
    if(!v||v.ok===false)return;
    let y=null,kind="cctv_uncalibrated";
    if(v.calibrated&&v.density!=null){y=Field.densityToUnit(v.density);kind="cctv_calibrated";}
    else y=Field.levelToUnit(v.level);
    if(y==null)return;
    const t=v.ts?Date.parse(String(v.ts).replace(" ","T")):NaN;
    const ageMin=isFinite(t)?Math.max(0,(now-t)/60000):null;
    obs.push({x:[cam.lng,cam.lat],y,sigma:Field.obsNoise({kind,confidence:v.confidence,flags:v.flags,ageMin})});
  });
  return obs;
}
function buildField(){
  FIELD=null;FGRID=null;NOBS=0;FIELD_VER++;                    // 장이 바뀌면 경로 메모도 버린다
  try{
    if(!CAMS||!CAMS.length||typeof Field==="undefined")return;
    const obs=fieldObs();if(!obs.length)return;
    const lngs=CAMS.map(c=>c.lng),lats=CAMS.map(c=>c.lat);
    const x0=Math.min(...lngs)-F_PAD,x1=Math.max(...lngs)+F_PAD,y0=Math.min(...lats)-F_PAD,y1=Math.max(...lats)+F_PAD;
    const g={x0,y0,dx:(x1-x0)/F_COLS,dy:(y1-y0)/F_ROWS,cols:F_COLS,rows:F_ROWS};
    FIELD=Field.buildField({observations:obs,grid:g,prior:null,fallbackPrior:.3,kernel:F_KERNEL});
    FGRID=g;FBOUNDS=[x0,y0,x1,y1];NOBS=obs.length;
  }catch(e){FIELD=null;}
}
function fieldAt(p){
  if(!FIELD||!FGRID)return null;
  const ix=Math.floor((p[0]-FGRID.x0)/FGRID.dx),iy=Math.floor((p[1]-FGRID.y0)/FGRID.dy);
  if(ix<0||iy<0||ix>=FGRID.cols||iy>=FGRID.rows)return null;
  const k=iy*FGRID.cols+ix;return{u:Math.max(0,Math.min(1,FIELD.mean[k])),sd:FIELD.sd[k]};
}
function paintField(){
  if(!MAPREADY||!MAP)return;
  if(!FIELD){$("legend").hidden=true;return;}
  try{
    const g=FGRID,ramp=fRamp(),cv=document.createElement("canvas");cv.width=g.cols;cv.height=g.rows;
    const cx=cv.getContext("2d"),img=cx.createImageData(g.cols,g.rows),px=img.data;
    const dim=DATA&&DATA.__offline?.55:1;
    // 가장자리에서 알파를 0 으로 — 사각형 경계선이 보이면 "여기까지가 데이터"라고 오해된다
    const fade=(i,len)=>{const t=Math.min(i+.5,len-.5-i)/(len*F_FEATHER);return t>=1?1:t<=0?0:t*t*(3-2*t);};
    for(let iy=0;iy<g.rows;iy++)for(let ix=0;ix<g.cols;ix++){
      const c=iy*g.cols+ix,u=Math.max(0,Math.min(1,FIELD.mean[c]));
      const conf=Math.max(0,1-FIELD.sd[c]/F_SD_MAX),cn=Math.min(1,conf/.15);
      const hot=Math.max(0,Math.min(1,(u-.3)/.7));
      const col=fHex(ramp,u),o=(.45+.50*hot)*(.45+.55*cn)*dim;
      const j=((g.rows-1-iy)*g.cols+ix)*4;               // 캔버스는 위가 북쪽, 격자는 아래가 남쪽
      px[j]=col[0]|0;px[j+1]=col[1]|0;px[j+2]=col[2]|0;
      px[j+3]=Math.round(255*Math.max(0,Math.min(1,o))*fade(ix,g.cols)*fade(iy,g.rows));
    }
    cx.putImageData(img,0,0);
    const [x0,y0,x1,y1]=FBOUNDS,coords=[[x0,y1],[x1,y1],[x1,y0],[x0,y0]],url=cv.toDataURL("image/png");
    const src=MAP.getSource("crowd");
    if(src)src.updateImage({url,coordinates:coords});
    else{
      MAP.addSource("crowd",{type:"image",url,coordinates:coords});
      MAP.addLayer({id:"crowd",type:"raster",source:"crowd",paint:{"raster-opacity":1,"raster-resampling":"linear","raster-fade-duration":0}},
        MAP.getLayer("route")?"route":undefined);
      // 물 레이어를 위에 다시 올린다 — 안 그러면 혼잡도가 한강을 덮는다
      const w=(MAP.getStyle().layers||[]).find(L=>L.type==="fill"&&(/water/i.test(L.id)||/water/i.test(L["source-layer"]||"")));
      if(w)MAP.addLayer(Object.assign({},w,{id:"crowd-water",paint:Object.assign({},w.paint||{},{"fill-opacity":1})}),MAP.getLayer("route")?"route":undefined);
    }
    $("legend").hidden=false;
  }catch(e){$("legend").hidden=true;}
}

// ── 근사 경로의 걷는 시간 — 경유점 사이를 8점씩 나눠 그 자리의 혼잡도로 속도를 정한다. 운영 화면과 같은 속도식(app/field.js).
//    본 곳(카메라 근처)은 관측 밀도, 못 본 곳은 가로 기본 — 장이 없으면 σ 최대 = 확신도 0 = 가로 기본.
//    직선이라 느려질 뿐 돌아가지는 못한다 — 우회는 보행망 A*(routeGraph) 의 몫.
function walkApprox(key){
  const pts=path(key);let sec=0,m=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],L=distM(a,b)*DETOUR,n=8;m+=L;
    for(let s=0;s<n;s++){const t=(s+.5)/n,p=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],f=fieldAt(p);
      sec+=f?Field.blendSeconds(L/n,f.u,f.sd,F_SD_MAX):Field.blendSeconds(L/n,0,F_SD_MAX,F_SD_MAX);}
  }
  return{min:Math.max(1,Math.round(sec/60)),km:m/1000,coords:smooth(pts),approx:true};
}
/** 1위 = 도보 + 대기 (2026-09-04 결정). 부하율 순위(Board.rank 기본)는 운영 화면에 남는다. */
function rankByTime(r){
  [].concat(r.open,r.closed,r.missing).forEach(x=>{const w=routeFor(x.key);x.min=w.min;x.km=w.km;x.approx=w.approx;});
  r.open.sort((a,b)=>(a.min+a.waitMin)-(b.min+b.waitMin));
  return r;
}
function hero(r){const all=[].concat(r.open,r.closed,r.missing);return(SEL&&all.find(x=>x.key===SEL))||r.open[0]||all[0]||null;}
const gcolor=g=>`var(--g-${g})`;
/** 순위 카드의 방면 한 줄 — 노선은 역명 괄호에 이미 있고, 고정 도보 추정(58분)은 지금 계산한 분과 부딪힌다. */
const why=d=>String(d||"").replace(/^.*?호선\s*·\s*/,"").replace(/도보 약 \d+분\(추정\)\s*·?\s*/,"");

// ── 신선도 필 — 경고창 없이 점 하나·단어 하나 (H10: 발행 시각만 보면 수집 끊김을 놓친다)
function freshUI(r){
  const fc=(DATA&&DATA.forecast)||{},gen=DATA&&DATA.generated,fr=Board.freshness(fc,gen);
  const hhmm=t=>{if(!t)return"";const d=new Date(String(t).replace(" ","T"));return isFinite(d)?d.toTimeString().slice(0,5):"";};
  if(DATA&&DATA.__offline)return{cls:"off",word:"오프라인",time:hhmm(gen)?hhmm(gen)+" 데이터":"저장된 데이터"};
  if(fr.reason==="collection")return{cls:"",word:"수집 끊김",time:fr.srcAge==null?"":fr.srcAge+"분 전"};
  if(fr.reason==="pre")return{cls:"",word:"수집 전",time:"예측표"};
  if(fr.reason==="publish")return{cls:"",word:fr.pubAge+"분 전",time:"갱신 늦음"};
  if(r.mode!=="live")return{cls:"",word:"사전 예측",time:hhmm(gen)};
  return{cls:"live",word:"실시간",time:hhmm(gen)};
}

// ── 화면 ──
let CUR=null;
function render(){
  const fc=(DATA&&DATA.forecast)||{};
  const avail=hoursOf(fc,Board.rank(fc,"21"));
  if(!HOUR)HOUR=Board.defaultHour();
  if(!avail.includes(HOUR))HOUR=avail.includes("21")?"21":avail[0];
  const r=rankByTime(Board.rank(fc,HOUR)),h=hero(r);CUR={r,h};
  const H=hoursOf(fc,r);
  const nowH=new Date().getHours(),isNow=nowH>=19&&nowH<=23&&HOUR===String(nowH),hl=isNow?"지금":HOUR+"시";   // 축제 창 밖이면 "21시"라고 말한다
  const f=freshUI(r);$("fresh").className="pill "+f.cls;$("fword").textContent=f.word;$("ftime").textContent=f.time;
  $("origin").textContent=GEO==="ok"?"내 위치에서":(ORIGIN[0]!==EVENT[0]||ORIGIN[1]!==EVENT[1])?"옮긴 핀에서":"이벤트광장에서";
  $("ranklab").textContent=hl+" 순위";

    $("chips").innerHTML="";$("rank").innerHTML="";$("eyebrow").textContent=hl;return;}
  const closed=h.grade==null&&h.note&&r.closed.includes(h),missing=h.grade==null&&!closed;
  const grade=closed?"통제":missing?"없음":h.grade;
  $("eyebrow").textContent=hl+(r.open[0]&&h.key===r.open[0].key?" · 추천":"");
  $("hname").textContent=h.name;

  $("hreason").textContent=reason;$("hreason").hidden=!reason;

    return`<button type="button" class="chip${on?" on":""}${cl&&!on?" dim":""}" data-k="${x.key}"><b>${esc(x.sh)}</b><small>${cl?(r.closed.includes(x)?"통제 ~21:40":"값 없음"):"걸어서 "+x.min+"분"}</small></button>`;}).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{SEL=b.dataset.k;render();});
  // 순위 top3
  $("rank").innerHTML=r.open.slice(0,3).map((x,i)=>`<div class="rk${x.key===h.key?" on":""}" data-k="${x.key}" style="--gc:${gcolor(x.grade)}">
      <span class="no">${String(i+1).padStart(2,"0")}</span>
      <div><div class="nm">${esc(x.sh)} <small>· ${x.min+x.waitMin}분</small></div><div class="why">${esc(why(x.desc))}${x.waitMin>0?" · 대기 "+x.waitMin+"분":""}</div></div>
      <span class="g">${x.grade}</span></div>`).join("")
    ||`<div class="rk"><span class="no">—</span><div><div class="nm">열린 출구 없음</div></div><span></span></div>`;
  $("rank").querySelectorAll(".rk[data-k]").forEach(b=>b.onclick=()=>{SEL=b.dataset.k;render();});
  chart(fc,h,H);
  drawRoute();
}
/** 예측표에 있는 시각들 — Board.rank 의 hours 는 폴백 표 기준(20~22)이라 실시간 19~23 을 못 담는다. */
function hoursOf(fc,r){
  const ex=(fc&&fc.exits)||{},set=new Set();
  Object.values(ex).forEach(row=>Object.keys(row||{}).forEach(k=>{if(/^\d+$/.test(k))set.add(String(k));}));
  const hs=[...set].sort((a,b)=>+a-+b);
  return hs.length?hs:r.hours;
}

// ── 시간대별 부하 차트 — 문지르면 시각이 바뀌고 히어로·순위·경로가 따라간다 ──
const CW=350,CH=132,CTOP=1.4,CPAD=24;
const cy=v=>104-Math.min(v,CTOP)/CTOP*88;
function chart(fc,h,H){
  const row=((fc.exits||{})[h.dk])||{},n=H.length,xs=i=>n>1?CPAD+i*(CW-2*CPAD)/(n-1):CW/2;   // 양끝 눈금 글자가 잘리지 않게 24 띄운다
  const pts=H.map((hh,i)=>{const c=row[hh]||{};return{x:xs(i),v:c.load,lo:c.load_lo,hi:c.load_hi,closed:c.closed,h:hh};});
  let line="",band="",back=[];
  pts.forEach(p=>{if(p.v==null)return;line+=(line?" L":"M")+p.x+" "+cy(p.v);
    if(p.lo!=null&&p.hi!=null){band+=(band?" L":"M")+p.x+" "+cy(p.hi);back.unshift(p.x+" "+cy(p.lo));}});
  if(back.length)band+=" L"+back.join(" L")+" Z";
  const ci=Math.max(0,H.indexOf(HOUR)),cp=pts[ci]||{x:xs(0)},cv=cp.v;
  const ticks=pts.map(p=>`<text x="${p.x}" y="124" text-anchor="middle" font-size="12" font-weight="${p.h===HOUR?800:500}" fill="${p.h===HOUR?"#14110C":"#8F897D"}">${p.h}:00</text>`).join("");
  $("svg").innerHTML=`<line x1="0" y1="104" x2="${CW}" y2="104" stroke="#E2DFD8" stroke-width="1"/>
    <line x1="0" y1="${cy(1)}" x2="${CW}" y2="${cy(1)}" stroke="#E2DFD8" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="340" y="${cy(1)-5}" text-anchor="end" font-size="11" font-weight="700" fill="#8F897D">한계</text>
    <path d="${band}" fill="rgba(20,17,12,.07)"/>
    <path d="${line}" fill="none" stroke="#14110C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${cp.x}" y1="8" x2="${cp.x}" y2="104" stroke="#14110C" stroke-width="1"/>
    <circle cx="${cp.x}" cy="${cv==null?104:cy(cv)}" r="6" fill="#FFFFFF" stroke="#14110C" stroke-width="2.5"/>${ticks}`;
  const tip=$("tip");
  tip.textContent=cp.closed?"통제":cv==null?"값 없음":"혼잡 "+cv.toFixed(2)+" · "+Board.grade(cv)+(cp.hi!=null?" ("+cp.lo.toFixed(2)+"–"+cp.hi.toFixed(2)+")":"");
  tip.style.left=(cp.x/CW*100)+"%";
  $("chart").dataset.hours=H.join(",");
}
let SCRUB=false;
function scrubAt(e){
  const el=$("chart"),H=(el.dataset.hours||"").split(",").filter(Boolean);if(!H.length)return;
  const b=el.getBoundingClientRect(),x=e.clientX-b.left,i=Math.max(0,Math.min(H.length-1,Math.round((x-CPAD/CW*b.width)/((b.width*(CW-2*CPAD)/CW)/Math.max(1,H.length-1)))));
  if(H[i]!==HOUR){HOUR=H[i];render();}
}
$("chart").addEventListener("pointerdown",e=>{SCRUB=true;$("chart").setPointerCapture(e.pointerId);scrubAt(e);});
$("chart").addEventListener("pointermove",e=>{if(SCRUB)scrubAt(e);});
$("chart").addEventListener("pointerup",()=>{SCRUB=false;});
$("chart").addEventListener("pointercancel",()=>{SCRUB=false;});

// ── 바텀시트 — 핸들 탭·스와이프 ──
function setOpen(o){
  OPEN=!!o;document.documentElement.classList.toggle("open",OPEN);$("more").hidden=!OPEN;
  if(!OPEN)$("body").scrollTop=0;
  setTimeout(()=>drawRoute(true),340);
}
let SY=null;
$("handle").addEventListener("pointerdown",e=>{SY=e.clientY;});
$("handle").addEventListener("pointerup",e=>{if(SY==null)return;const dy=e.clientY-SY;SY=null;
  if(dy<-30)setOpen(true);else if(dy>30)setOpen(false);else setOpen(!OPEN);});
$("handle").addEventListener("pointercancel",()=>{SY=null;});
$("handle").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setOpen(!OPEN);}});
$("handle").tabIndex=0;

// ── 위치 — 묻지 않는다. 권한 팝업은 브라우저 것이고, 거절이면 이벤트광장 기준으로 그냥 간다 ──
function setGeo(state,pos){
  GEO=state;if(pos)ORIGIN=pos;
  const note=$("geonote"),txt=$("geotext"),btn=$("askgeo");
  if(state==="ok"){note.hidden=true;}
  else{note.hidden=false;
    txt.innerHTML=state==="far"?"<b>여의도 밖이라 이벤트광장 기준</b> · 핀을 끌어 옮기세요":"<b>이벤트광장 기준</b> · 핀을 끌어 옮기세요";
    btn.hidden=state==="far"||!navigator.geolocation;}
  if(ME){ME.setDraggable(state!=="ok");ME.getElement().classList.toggle("drag",state!=="ok");ME.setLngLat(ORIGIN);}
  if(DATA)render();
}
function askGeo(){
  if(!navigator.geolocation){setGeo("denied");return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const q=[p.coords.longitude,p.coords.latitude];
    if(distM(q,EVENT)>FAR_M)setGeo("far");else setGeo("ok",q);
  },()=>setGeo("denied"),{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
}
$("askgeo").onclick=askGeo;

// ── 지도 — 풀블리드. 오프라인이면 타일 없는 빈 바탕에 혼잡장과 경로만. ──
function sheetH(){return $("sheet").getBoundingClientRect().height;}
function initMap(){
  if(typeof maplibregl==="undefined"){return;}                 // 지도 라이브러리를 못 받아도 시트는 그대로 답한다
  const offline=!!(DATA&&DATA.__offline);
  $("hatch").hidden=!offline;
  const style=offline?{version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#E9E6DF"}}]}
                     :"https://tiles.openfreemap.org/styles/positron";
  MAP=new maplibregl.Map({container:"map",style,center:[126.929,37.529],zoom:13.4,attributionControl:false});
  MAP.on("error",e=>{const m=String(e&&e.error&&e.error.message||"");if(!/tile|glyph|sprite|fetch|source/i.test(m))console.warn("map",m);});
  MAP.on("load",()=>{
    MAP.addSource("route",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    MAP.addLayer({id:"route",type:"line",source:"route",paint:{"line-color":"#1A1A1A","line-width":3},layout:{"line-cap":"round","line-join":"round"}});
    // 라벨은 경로가 끝나는 점(DEST)에 — Board.EXITS.ll 은 운영 화면 라벨 배치용이라 경로 끝과 어긋난다.
    // 여의도(5)·(9)는 같은 역이라 위아래로 비켜 세운다.
    const LBL_OFF={yd5:[0,-13],yd9:[0,13]};
    Board.EXITS.forEach(e=>{const el=document.createElement("div");el.className="lbl";el.textContent=e.sh;LABELS[e.k]=el;
      new maplibregl.Marker({element:el,anchor:"center",offset:LBL_OFF[e.k]||[0,0]}).setLngLat(DEST[e.k]||[e.ll[1],e.ll[0]]).addTo(MAP);});
    const me=document.createElement("div");me.className="me"+(GEO!=="ok"?" drag":"");
    me.innerHTML='<img src="assets/ci_logo_s.png" alt="현재 위치">';
    ME=new maplibregl.Marker({element:me,draggable:GEO!=="ok",anchor:"center"}).setLngLat(ORIGIN).addTo(MAP);
    ME.on("dragend",()=>{const p=ME.getLngLat();ORIGIN=[p.lng,p.lat];render();});
    MAPREADY=true;
    paintField();
    drawRoute(true);
  });
}
function smooth(pts,n=12){
  if(pts.length<3)return pts;
  const P=[pts[0]].concat(pts,[pts[pts.length-1]]),out=[pts[0]];
  for(let i=1;i<P.length-2;i++){const[p0,p1,p2,p3]=[P[i-1],P[i],P[i+1],P[i+2]];
    for(let s=1;s<=n;s++){const t=s/n,t2=t*t,t3=t2*t;
      out.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)));}}
  return out;
}
function drawRoute(force){
  if(!MAPREADY||!CUR||!CUR.h||!MAP.getSource("route"))return;
  const h=CUR.h;
  for(const k in LABELS)LABELS[k].classList.toggle("on",k===h.key);
  const pts=routeFor(h.key).coords;
  MAP.getSource("route").setData({type:"FeatureCollection",features:[{type:"Feature",geometry:{type:"LineString",coordinates:pts}}]});
  if(OPEN)return;                                              // 펼친 시트 아래로 지도를 맞출 자리가 없다
  const key=h.key+"|"+ORIGIN.join(",")+"|"+(GRAPH?1:0);        // 보행망이 오면 선 모양이 바뀌니 한 번 다시 맞춘다
  if(!force&&key===FITKEY)return;                              // 5분 갱신마다 지도를 다시 움직이지 않는다
  FITKEY=key;
  const bb=new maplibregl.LngLatBounds();pts.forEach(p=>bb.extend(p));
  MAP.fitBounds(bb,{padding:{top:120,left:50,right:50,bottom:sheetH()+30},maxZoom:15.5,duration:FITTED?500:0});
  FITTED=true;
}

// ── 시작 ──
(async()=>{
  await load();
  initMap();
  askGeo();
  loadGraph();                                                 // 첫 답은 근사로 이미 떠 있다 — 보행망은 뒤에서
  setInterval(load,5*60*1000);
})();
</script>
